name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    services:
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run openapi:check
      - run: npx --yes @redocly/cli@2.57.0 lint openapi.yaml
      - run: npm run test:coverage
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t image-processing-service .
      - name: Smoke test
        run: |
          docker run -d --name svc -p 3000:3000 image-processing-service
          for i in $(seq 1 20); do curl -fs localhost:3000/health && exit 0; sleep 1; done
          docker logs svc
          exit 1
